<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Substack Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --s1: #2a78d6; --s1-wash: rgba(42,120,214,.10); --s2: #eb6834; --s3: #1baf7a;
    --good: #006300; --bad: #d03b3b; --accent: #ff6719; --hover: rgba(11,11,11,.04);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    /* Rampa secuencial de un solo tono para el mapa: cuanto más oscuro, más suscriptores. */
    --map-0: #e8e7e1; --map-1: #cde2fb; --map-2: #9ec5f4; --map-3: #5598e7; --map-4: #2a78d6; --map-5: #184f95;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --s1: #3987e5; --s1-wash: rgba(57,135,229,.12); --s2: #d95926; --s3: #199e70;
      --good: #0ca30c; --bad: #e66767; --hover: rgba(255,255,255,.05);
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
      --map-0: #2c2c2a; --map-1: #123a63; --map-2: #17538f; --map-3: #1d6bb8; --map-4: #2a86df; --map-5: #6badf0;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
  header { margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .hrow { display: flex; align-items: center; gap: 12px; }
  .hrow1 { justify-content: space-between; margin-bottom: 12px; }
  .hnav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .navbtn.plain { font-weight: 500; }
  .navbtn[aria-current="true"], .navbtn.plain[aria-current="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .iconbtn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink-2); cursor: pointer; }
  .iconbtn:hover { background: var(--hover); color: var(--ink); }
  .iconbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  /* Paleta de búsqueda: se superpone para que los resultados se vean sin depender del scroll. */
  .palette { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; }
  .palette[hidden] { display: none; }
  .palbox { width: 100%; max-width: 620px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
  .palbox input { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--grid); background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding: 15px 18px; outline: none; }
  .palresults { max-height: 52vh; overflow: auto; }
  .palresults button { display: block; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; padding: 10px 18px; cursor: pointer; }
  .palresults button:hover, .palresults button.sel { background: var(--hover); }
  .palresults .pt { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .palresults .pm { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .palempty { padding: 18px; color: var(--muted); font-size: 13px; }
  .palbox.help { padding: 20px 22px 22px; }
  .palbox.help h3 { margin: 0 0 12px; font-size: 15px; }
  .palbox.help ol { margin: 0 0 16px; padding-left: 20px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .palbox.help code { background: var(--page); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .navsel { position: relative; }
  .navbtn { display: inline-flex; align-items: center; gap: 8px; max-width: 340px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .navbtn .nl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navmore { flex: none; background: var(--ink); color: var(--page); border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .navmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 260px; max-height: 62vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 6px; }
  .navmenu button { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .navmenu button:hover { background: var(--hover); }
  .navmenu button[aria-current="true"] { font-weight: 600; }
  .navmenu .grp { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 9px 10px 4px; }
  .navmenu hr { border: 0; border-top: 1px solid var(--grid); margin: 6px 4px; }
  select.ctl { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; max-width: 280px; cursor: pointer; }
  select.ctl:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
  .filters .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .filters .seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 10px; font: inherit; cursor: pointer; }
  .filters .seg button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
  .filters input[type=search] { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 220px; }
  .filters .spacer { flex: 1; }
  .filters .meta { color: var(--muted); font-size: 12px; }
  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -.01em; }
  .tile.hero .value { font-size: 48px; line-height: 1.05; }
  .tile .delta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); }
  .charts { grid-template-columns: 2fr 1fr; margin-bottom: 12px; }
  .charts .wide { grid-column: 1 / -1; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
  .card.collapsible .head { cursor: pointer; user-select: none; }
  .headactions { display: flex; align-items: center; gap: 6px; flex: none; }
  .chev { flex: none; width: 22px; height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer; position: relative; }
  .chev::before { content: ''; position: absolute; inset: 0; margin: auto; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s ease; }
  .card.collapsed .chev::before { transform: rotate(-45deg) translate(-1px, 1px); }
  .card.collapsed .cardbody { display: none; }
  .card.collapsed { padding-bottom: 12px; }
  .card.collapsed .head { margin-bottom: 0; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .card .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .head button:not(.seg button) { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  svg { display: block; width: 100%; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .area { fill: var(--s1-wash); }
  .bar { fill: var(--s1); } .bar.dim { fill: var(--s1); opacity: .35; } .bar.hi { fill: var(--s2); }
  .hit { fill: transparent; cursor: pointer; }
  .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .crosshair { stroke: var(--axis); stroke-width: 1; }
  .dlabel { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--page); padding: 6px 9px; border-radius: 6px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: 300px; }
  .tooltip b { display: block; margin-bottom: 2px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child, th.t, td.t { text-align: left; }
  th { color: var(--ink-2); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
  th[aria-sort="descending"]::after { content: " ↓"; } th[aria-sort="ascending"]::after { content: " ↑"; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--hover); }
  td.t { white-space: normal; min-width: 260px; }
  td.t .title { font-weight: 500; } td.t .date { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--hover); color: var(--ink-2); margin-left: 6px; }
  .vs { font-size: 12px; } .vs.up { color: var(--good); } .vs.down { color: var(--bad); }
  .tablewrap { overflow-x: auto; }
  tbody tr.detailrow { cursor: default; background: var(--page); }
  tbody tr.detailrow:hover { background: var(--page); }
  .detailrow > td { padding: 0; text-align: left; white-space: normal; border-bottom: 1px solid var(--grid); }
  .detailbox { padding: 20px 22px 24px; }
  .detailrow .dstat { background: var(--surface); }
  tbody tr.selected { background: var(--hover); }
  tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--s1); }
  .dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
  .dhead h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
  .dhead h3 a { text-decoration: none; } .dhead h3 a:hover { text-decoration: underline; }
  .dhead .sub { color: var(--muted); font-size: 12px; }
  .dhead .btn { flex: none; padding: 5px 12px; font-size: 12px; }
  .dstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .dstat { background: var(--page); border-radius: 10px; padding: 11px 13px; }
  .dstat .l { font-size: 11px; color: var(--ink-2); }
  .dstat .v { font-size: 21px; font-weight: 600; letter-spacing: -.01em; margin-top: 3px; }
  .dstat .n { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .dcaption { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 18px 0 9px; }
  .dsep { border: 0; border-top: 1px solid var(--grid); margin: 22px 0 18px; }
  .dcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 30px; }
  .dcols h4 { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .srcrow { margin-bottom: 11px; }
  .srcrow .t { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 5px; }
  .srcrow .t span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .srcbar { height: 5px; border-radius: 3px; background: var(--grid); }
  .srcbar i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
  .linkrow { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .linkrow span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linkrow span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dempty { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .sr { position: absolute; left: -9999px; }
  .geowrap { display: grid; grid-template-columns: 1.9fr 1fr; gap: 26px; align-items: start; }
  @media (max-width: 900px) { .geowrap { grid-template-columns: 1fr; gap: 18px; } }
  .geowrap svg { display: block; width: 100%; height: auto; }
  .cpath { fill: var(--map-0); stroke: var(--surface); stroke-width: .6; }
  .cpath.has { cursor: default; }
  .cpath:hover { stroke: var(--ink); stroke-width: 1; }
  .maplegend { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .maplegend i { display: block; width: 26px; height: 9px; border-radius: 2px; }
  .credit { margin: 28px 0 10px; text-align: center; font-size: 11px; color: var(--muted); }
  .bmc { display: inline-flex; align-items: center; gap: 7px; margin: 0 auto 30px; padding: 8px 16px; border-radius: 8px; background: #ffdd00; color: #000; font-size: 13px; font-weight: 600; text-decoration: none; }
  .bmc:hover { filter: brightness(.97); }
  .palbox.analyze { padding: 18px 20px 20px; max-height: 74vh; overflow: auto; }
  .palbox.analyze h3 { margin: 0 0 3px; font-size: 15px; }
  .asksub { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  .asks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .ask { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .ask .txt { font-size: 13px; }
  .ask .txt small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .ask button { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 5px 11px; border-radius: 8px; font: inherit; font-size: 12px; cursor: pointer; }
  .ask button:hover { background: var(--hover); }
  .ask button.done { border-color: var(--good); color: var(--good); }
  #asktext { width: 100%; box-sizing: border-box; margin: 0 0 10px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; }
  .askfoot { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .credwrap { text-align: center; }
  .credit a { color: inherit; }
  .credit a.author { text-decoration: underline; }
  .relnote { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--s1); border-radius: 8px; padding: 9px 13px; margin: 0 0 12px; font-size: 12px; color: var(--ink-2); }
  /* Una regla de clase con display gana a [hidden], que solo aporta display: none. */
  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .cmp-charts { grid-template-columns: repeat(3, 1fr); margin-bottom: 12px; }
  @media (max-width: 900px) { .cmp-charts { grid-template-columns: 1fr; } }
  .pubdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .cmp-table td.t { min-width: 180px; }
  .cmp-table tbody tr { cursor: pointer; }
  .top-list { list-style: none; margin: 0; padding: 0; }
  .top-list li { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--grid); }
  .top-list .rank { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .top-list .pt { font-weight: 500; } .top-list .pm { color: var(--muted); font-size: 12px; }
  .top-list .pv { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .top-list .pv small { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow hrow1">
      <h1><span data-i18n="title"></span> <small id="who"></small></h1>
      <div class="hnav">
        <div class="navsel">
          <button class="navbtn" id="navbtn" aria-haspopup="menu" aria-expanded="false">
            <i class="pubdot" id="navdot"></i><span class="nl" id="navlabel"></span><span class="navmore" id="navmore" hidden></span>
          </button>
          <div class="navmenu" id="navmenu" role="menu" hidden></div>
        </div>
        <button class="navbtn plain" id="notesbtn" hidden></button>
        <button class="iconbtn" id="searchbtn" data-i18n-aria="searchPosts" title="">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 L18 18"/></svg>
        </button>
        <button class="iconbtn" id="analyzebtn" data-i18n-aria="claudeTitle" title="">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.2 11.9 8.1 17.8 10 11.9 11.9 10 17.8 8.1 11.9 2.2 10 8.1 8.1Z"/></svg>
        </button>
        <div class="navsel">
          <button class="iconbtn" id="langbtn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="langLabel" title="">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><ellipse cx="10" cy="10" rx="3" ry="7.2"/><path d="M3 7.6h14M3 12.4h14"/></svg>
          </button>
          <div class="navmenu" id="langmenu" role="menu" hidden>
            <button role="menuitem" data-lang="en">English</button>
            <button role="menuitem" data-lang="es">Español</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="palette" id="palette" hidden>
    <div class="palbox">
      <input type="search" id="palinput" data-i18n-ph="searchPosts" autocomplete="off">
      <div class="palresults" id="palresults"></div>
    </div>
  </div>
  <div class="palette" id="analyzebox" hidden>
    <div class="palbox analyze">
      <h3 data-i18n="claudeTitle"></h3>
      <p class="asksub" data-i18n="claudeSub"></p>
      <ul class="asks" id="asks"></ul>
      <div class="askfoot"><span data-i18n="claudeFoot"></span> <a href="https://claude.ai/new" target="_blank" rel="noopener">claude.ai&nbsp;↗</a></div>
    </div>
  </div>
  <div class="palette" id="askbox" hidden>
    <div class="palbox help">
      <h3 data-i18n="claudeManual"></h3>
      <textarea id="asktext" readonly rows="10"></textarea>
      <button class="btn" id="askclose" data-i18n="close"></button>
    </div>
  </div>

  <div class="filters">
    <div class="seg" id="range" role="group" data-i18n-aria="rangeLabel">
      <button data-days="0" aria-pressed="true" data-i18n="all"></button>
      <button data-days="365" data-i18n="d365"></button>
      <button data-days="90" data-i18n="d90"></button>
      <button data-days="30" data-i18n="d30"></button>
    </div>
    <div class="seg" id="mode" role="group" data-i18n-aria="modeLabel">
      <button data-mode="abs" aria-pressed="true" data-i18n="absolute"></button>
      <button data-mode="rel" aria-pressed="false" data-i18n="relative"></button>
    </div>
    <div class="spacer"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="relnote" id="relnote" data-i18n="relNote" hidden></div>

  <div id="compare" hidden>
    <div class="grid tiles" id="cmp-tiles"></div>
    <div class="card" style="margin-bottom:12px">
      <div class="head"><div><h2 data-i18n="publications"></h2><div class="sub" id="cmp-sub"></div></div></div>
      <div class="legend" id="cmp-legend"></div>

  const DATA = await (async () => {

    const inline = el ? el.textContent.trim() : '';

  })();

  const $ = (s, el = document) => el.querySelector(s);
  // El panel se adapta a quien lo abre: español si el navegador lo está, inglés en cualquier
  // otro caso. ?lang=es o ?lang=en fuerza uno concreto (así se capturan las imágenes del README).
  // Inglés por defecto: el proyecto se distribuye en inglés y quien lo abra puede no
  // saber español. La elección del selector se recuerda en este navegador.
  const LANG_KEY = 'substack-dashboard-lang';
  const LANG = (() => {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'es' || q === 'en') { try { localStorage.setItem(LANG_KEY, q); } catch {} return q; }
    try { const s = localStorage.getItem(LANG_KEY); if (s === 'es' || s === 'en') return s; } catch {}
    return 'en';
  })();
  const LOCALE = LANG === 'es' ? 'es-ES' : 'en';
  const T = STRINGS[LANG];
  const nf = new Intl.NumberFormat(LOCALE);
  const pf = (x, d = 1) => (x == null || isNaN(x) ? '—' : new Intl.NumberFormat(LOCALE, { style: 'percent', minimumFractionDigits: d, maximumFractionDigits: d }).format(x));

  const dfs = (s) => new Date(s).toLocaleDateString(LOCALE, { day: '2-digit', month: 'short' });
  const compact = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + ' M' : n >= 1e4 ? Math.round(n / 1e3) + ' k' : nf.format(n);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const state = { pub: -1, days: 0, q: '', mode: 'abs', sort: { key: 'date', dir: 'desc' }, selected: null, cmpSort: { key: 'subscribers', dir: 'desc' }, notesSort: { key: 'date', dir: 'desc' }, topMetric: 'views' };

  // ---------- métricas relativas ----------
  // El alcance se normaliza por la audiencia que recibió el envío (`delivered`, el tamaño real
  // de la lista en ese momento) y la interacción por las vistas del post, que existen incluso
  // en publicaciones que no se enviaron por email. Sin denominador válido devolvemos null y
  // pintamos "—": es más honesto que fingir un cero.
  const REACH_DEN = 100, ENG_DEN = 100, CONV_DEN = 1000;
  // Normalizar tiene un efecto secundario: con un denominador diminuto la proporción se
  // dispara (un post enviado a 25 personas que se hizo viral en la web da 1.500 vistas por
  // 100 suscriptores). Eso no es rendimiento, es ruido. Las clasificaciones exigen un mínimo;
  // las tablas siguen mostrando el valor junto a su denominador para que se pueda juzgar.
  const MIN_DEN = 30;
  const isRel = () => state.mode === 'rel';
  const rate = (num, den, per) => (den > 0 ? (num || 0) / den * per : null);
  const relOf = (p) => ({
    views_rel: rate(p.views, p.delivered, REACH_DEN),
    reactions_rel: rate(p.reactions, p.views, ENG_DEN),
    comments_rel: rate(p.comments, p.views, ENG_DEN),
    signups_rel: rate(p.signups, p.views, CONV_DEN),

  // pesar lo mismo que uno con 400 al resumir toda una publicación.
  const aggRate = (posts, numK, denK, per) => rate(posts.reduce((a, x) => a + (x[numK] || 0), 0), posts.reduce((a, x) => a + (x[denK] || 0), 0), per);

  // Buscar en la tabla dejaba los resultados fuera de pantalla con los paneles abiertos.

  function palRender() {
    const q = palinput.value.trim().toLowerCase();

      .filter(p => (p.title || '').toLowerCase().includes(q))
      .sort((a, b) => new Date(b.date) - new Date(a.date))

    if (e.key === 'Escape') return palClose();
    if (e.key === 'Enter') return palGo(palSel);
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    if (!palHits.length) return;

    [...palresults.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('sel', i === palSel));

    if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); palOpen();

  // ---------- paneles plegables ----------
  // Qué paneles están plegados se guarda en este navegador, así que sobrevive a las
  // sincronizaciones (que regeneran el HTML pero no tocan el almacenamiento local).
  const PANELS_KEY = 'substack-dashboard-panels';
  const readPanels = () => { try { return JSON.parse(localStorage.getItem(PANELS_KEY)) || {}; } catch { return {}; } };
  const writePanels = (p) => { try { localStorage.setItem(PANELS_KEY, JSON.stringify(p)); } catch {} };

  function applyPanel(card, collapsed) {
    card.classList.toggle('collapsed', collapsed);
    const chev = card.querySelector('.chev');
    if (chev) chev.setAttribute('aria-expanded', String(!collapsed));
  }
  // Un gráfico plegado se mide con ancho cero, así que al desplegarlo hay que repintarlo.
  const REDRAW = { subs: () => renderSubs(), sources: () => renderSources(), views: () => renderViews(), geo: () => renderGeo(),
                   cmpSubs: () => renderCompare(), cmpViews: () => renderCompare(), cmpOpen: () => renderCompare() };
  const restorePanels = () => { const saved = readPanels(); document.querySelectorAll('.card.collapsible').forEach(c => applyPanel(c, !!saved[c.dataset.panel])); };
  function initPanels() {
    const saved = readPanels();
    document.querySelectorAll('.card.collapsible').forEach(card => {
      const key = card.dataset.panel;
      applyPanel(card, !!saved[key]);
      card.querySelector('.head').addEventListener('click', (e) => {
        if (e.target.closest('button') && !e.target.closest('.chev')) return;   // el botón «ver tabla» no pliega
        const now = !card.classList.contains('collapsed');
        applyPanel(card, now);
        const p = readPanels(); p[key] = now; writePanels(p);
        if (!now && REDRAW[key]) REDRAW[key]();
      });
    });
  }

  // ---------- navegación ----------
  // Navegación: se muestra la publicación actual y, si hay más, un contador «+N» que abre
  // el menú. Lo habitual es tener una sola newsletter, así que el caso común no paga nada.
  const hasNotes = !!(DATA.notes && DATA.notes.length);
  const navbtn = $('#navbtn'), navmenu = $('#navmenu'), navlabel = $('#navlabel'), navdot = $('#navdot'), navmore = $('#navmore');

  // La principal la marca el propio Substack; si no consta, la de más suscriptores.
  const primaryIdx = (() => {
    const id = DATA.primary_publication_id;
    const byId = id != null ? DATA.publications.findIndex(p => p.id === id) : -1;
    if (byId >= 0) return byId;
    let best = 0, bestN = -1;
    DATA.publications.forEach((p, i) => { const n = p.summary?.totalEmail ?? 0; if (n > bestN) { bestN = n; best = i; } });
    return best;
  })();

  const viewName = (idx) => idx === -2 ? T.notesTab : idx === -1 ? T.compareAll : (DATA.publications[idx]?.name || '');
  function syncNav() {
    const idx = state.pub;

    + (DATA.publications.length > 1 ? `<hr><button role="menuitem" data-idx="-1">${esc(T.compareAll)}</button>` : '');
  const notesbtn = $('#notesbtn');
  notesbtn.hidden = !hasNotes;

  const closeMenu = () => { navmenu.hidden = true; navbtn.setAttribute('aria-expanded', 'false'); };
  function closeAllMenus() {

  }
  navbtn.addEventListener('click', e => {
    e.stopPropagation();

    navmenu.hidden = !open;

  });
  navmenu.addEventListener('click', e => { const b = e.target.closest('button[data-idx]'); if (!b) return; closeMenu(); selectView(+b.dataset.idx); });
  document.addEventListener('click', e => { if (!e.target.closest('.navsel')) closeAllMenus(); });

  // ---------- analizar con Claude ----------
  // El panel enseña qué pasó; la lectura de por qué la hace mejor un modelo con los datos
  // delante. En vez de mandar nada a ningún sitio, prepara la pregunta con los números ya
  // dentro para pegarla en Claude: los datos no salen de aquí si el usuario no los pega.
  const MAX_ROWS = 60;                       // suficiente para razonar sin inflar el pegado
  const mdTable = (head, rows) => [`| ${head.join(' | ')} |`, `|${head.map(() => '---').join('|')}|`,
    ...rows.map(r => `| ${r.join(' | ')} |`)].join('\n');
  const clean = (s) => String(s || '').replace(/\s+/g, ' ').replace(/\|/g, '/').trim();
  const pct1 = (v) => v == null ? '—' : (v * 100).toFixed(1) + '%';

  function askData() {
    if (state.pub === -2) {
      const notes = (DATA.notes || []).slice(0, MAX_ROWS);
      return `Notes: ${(DATA.notes || []).length}\n\n` + mdTable(
        ['Date', 'Note', 'Reactions', 'Restacks', 'Replies'],
        notes.map(n => [String(n.date || '').slice(0, 10), clean(n.body).slice(0, 120), n.reactions, n.restacks, n.replies]));
    }
    if (state.pub === -1) {
      return mdTable(['Publication', 'Subscribers', 'Posts', 'Views/post', 'Open rate', 'Reactions/post'],
        DATA.publications.map(p => {
          const posts = p.posts, n = posts.length || 1;
          return [clean(p.name), p.summary?.totalEmail ?? '—', posts.length,
            Math.round(posts.reduce((a, x) => a + (x.views || 0), 0) / n),
            pct1(aggRate(posts, 'opened', 'delivered', 1)),
            (posts.reduce((a, x) => a + (x.reactions || 0), 0) / n).toFixed(1)];
        }));
    }
    const p = pub(), posts = filtered().slice(0, MAX_ROWS);
    const head = [`Publication: ${clean(p.name)} (${p.host})`,
      `Subscribers: ${p.summary?.totalEmail ?? '—'} · Published posts: ${p.posts.length} · Range shown: ${rangeLabel()}`,
      `Aggregate open rate: ${pct1(aggRate(p.posts, 'opened', 'delivered', 1))}`, ''].join('\n');
    return head + mdTable(['Date', 'Title', 'Views', 'Open rate', 'Reactions', 'Comments', 'Signups'],
      posts.map(x => [String(x.date || '').slice(0, 10), clean(x.title).slice(0, 90), x.views,
        pct1(x.open_rate), x.reactions, x.comments, x.signups]));
  }

  const rangeLabel = () => state.days ? T.rangeDays(state.days) : T.rangeAll;

  // navigator.clipboard no existe en file:// en algunos navegadores; el textarea sí funciona.
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }

  const analyzebox = $('#analyzebox');
  $('#analyzebtn').addEventListener('click', () => { renderClaude(); analyzebox.hidden = false; });
  analyzebox.addEventListener('click', e => { if (e.target === analyzebox) analyzebox.hidden = true; });
  $('#askclose').addEventListener('click', () => { $('#askbox').hidden = true; });

  function renderClaude() {
    const asks = state.pub === -1 ? T.asksCmp : state.pub === -2 ? T.asksNotes : T.asksPub;
    const list = $('#asks');
    list.innerHTML = asks.map(([label], i) =>
      `<li class="ask"><div class="txt">${label}</div><button data-i="${i}">${T.claudeCopy}</button></li>`).join('');
    list.onclick = async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const prompt = `${asks[+b.dataset.i][1]}\n\n${askData()}`;
      if (!await copyText(prompt)) {
        // Hay navegadores que bloquean el portapapeles en file://: se enseña para copiar a mano.
        const box = $('#askbox'), ta = $('#asktext');
        ta.value = prompt; box.hidden = false; ta.select();
        return;
      }
      b.textContent = T.claudeCopied; b.classList.add('done');
      setTimeout(() => { b.textContent = T.claudeCopy; b.classList.remove('done'); }, 2000);
    };
  }

  function selectView(idx) {

  $('#mode').addEventListener('click', e => {

  });
  $('#cmp-top-metric').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.topMetric = b.dataset.m; [...$('#cmp-top-metric').children].forEach(c => c.setAttribute('aria-pressed', c === b)); renderTop(); });
  $('#who').textContent = DATA.user ? '@' + DATA.user.handle : '';
  const langbtn = $('#langbtn'), langmenu = $('#langmenu');

  langbtn.addEventListener('click', e => { e.stopPropagation(); const open = langmenu.hidden; closeAllMenus(); langmenu.hidden = !open; langbtn.setAttribute('aria-expanded', String(open)); });
  langmenu.addEventListener('click', e => {

  $('#range').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.days = +b.dataset.days; [...$('#range').children].forEach(c => c.setAttribute('aria-pressed', c === b)); render(); });
  $('#subs-table-btn').textContent = T.viewTable;
  $('#subs-table-btn').onclick = () => { const t = $('#subs-table'); t.hidden = !t.hidden; $('#subs-table-btn').textContent = t.hidden ? T.viewTable : T.hideTable; };

  const pub = () => DATA.publications[state.pub];
  const cutoff = () => state.days ? Date.now() - state.days * 864e5 : 0;
  const filtered = () => pub().posts.filter(p => new Date(p.date).getTime() >= cutoff() && (!state.q || (p.title || '').toLowerCase().includes(state.q)));

  function render() {
    const cmp = state.pub === -1, notes = state.pub === -2;
    $('#compare').hidden = !cmp; $('#notesview').hidden = !notes;
    renderClaude();
    $('#pubview').hidden = cmp || notes;

    $('#relnote').hidden = notes || !isRel();

    if (cmp) { renderCompare(); restorePanels(); return; }
    renderMeta(); renderTiles(); renderSubs(); renderSources(); renderViews(); renderTable(); renderGeo();
    restorePanels();
  }

  // ---------- comparativa ----------
  const postsInRange = (p) => p.posts.filter(x => new Date(x.date).getTime() >= cutoff());
  function pubMetrics(p, i) {
    const posts = postsInRange(p), n = posts.length, sent = posts.filter(x => x.delivered > 0);
    const sum = (k) => posts.reduce((a, x) => a + (x[k] || 0), 0);
    const v30 = p.summary_v2?.[30] || {};
    return {
      i, name: p.name, host: p.host, subscribers: p.summary?.totalEmail ?? v30.totalSubscribersEnd ?? 0,
      delta30: (v30.totalSubscribersEnd != null && v30.totalSubscribersStart != null) ? v30.totalSubscribersEnd - v30.totalSubscribersStart : null,
      views30: p.summary?.views ?? null, posts: n, views: sum('views'), views_avg: n ? sum('views') / n : null,
      open_rate: sent.length ? sent.reduce((a, x) => a + x.open_rate, 0) / sent.length : null,
      ctr: sent.length ? sent.reduce((a, x) => a + x.ctr, 0) / sent.length : null,
      reactions: sum('reactions'), reactions_avg: n ? sum('reactions') / n : null, comments: sum('comments'), signups: sum('signups'), unsubscribes: sum('unsubscribes'),
      den_reach: posts.reduce((a, x) => a + (x.delivered || 0), 0),
      den_eng: posts.reduce((a, x) => a + (x.views || 0), 0),
      views_rel: aggRate(posts, 'views', 'delivered', REACH_DEN),
      reactions_rel: aggRate(posts, 'reactions', 'views', ENG_DEN),
      comments_rel: aggRate(posts, 'comments', 'views', ENG_DEN),
      signups_rel: aggRate(posts, 'signups', 'views', CONV_DEN),
    };
  }
  const CMP_COLS_ABS = [
    { key: 'name', label: T.cPublication, t: true }, { key: 'subscribers', label: T.subscribers }, { key: 'delta30', label: T.cDelta30 },
    { key: 'posts', label: T.posts }, { key: 'views', label: T.mViews }, { key: 'views_avg', label: T.cViewsPerPost },
    { key: 'open_rate', label: T.mOpen }, { key: 'ctr', label: 'CTR' }, { key: 'reactions_avg', label: T.cReactionsPerPost }, { key: 'comments', label: T.cComments }, { key: 'signups', label: T.mSignups },
  ];
  const CMP_COLS_REL = [
    { key: 'name', label: T.cPublication, t: true }, { key: 'subscribers', label: T.subscribers }, { key: 'delta30', label: T.cDelta30 },
    { key: 'posts', label: T.posts }, { key: 'views_rel', label: T.cViewsPer100, title: T.cViewsPer100Title },
    { key: 'open_rate', label: T.mOpen }, { key: 'ctr', label: 'CTR' },
    { key: 'reactions_rel', label: T.cReactionsPer100 }, { key: 'comments_rel', label: T.cCommentsPer100 }, { key: 'signups_rel', label: T.cSignupsPer1000 },
  ];
  const cmpCellOf = (m, key) => {
    if (key === 'name') return `<td class="t"><i class="pubdot" style="background:${pubColor(m.i)}"></i><span class="title">${esc(m.name)}</span><div class="date">${esc(m.host)}</div></td>`;
    if (key === 'delta30') return `<td>${signed(m.delta30)}</td>`;
    if (key === 'open_rate' || key === 'ctr') return `<td>${pf(m[key])}</td>`;
    if (REL_KEYS.has(key)) return `<td>${dec(m[key])}</td>`;
    if (key === 'views_avg') return `<td>${m.views_avg == null ? '—' : nf.format(Math.round(m.views_avg))}</td>`;
    if (key === 'reactions_avg') return `<td>${m.reactions_avg == null ? '—' : dec(m.reactions_avg)}</td>`;
    return `<td>${nf.format(m[key] || 0)}</td>`;
  };
  const signed = (d) => d == null ? '—' : d === 0 ? '0' : `<span class="vs ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${nf.format(Math.abs(d))}</span>`;
  function renderCompare() {
    const M = DATA.publications.map(pubMetrics);
    const range = state.days ? T.rangeDays(state.days) : T.rangeAll;
    $('#meta').textContent = T.metaLine(DATA.publications.length, new Date(DATA.generated_at).toLocaleString(LOCALE));
    const tot = (k) => M.reduce((a, m) => a + (m[k] || 0), 0);
    const best = (k) => M.filter(m => m[k] != null && m.posts > 0).sort((a, b) => b[k] - a[k])[0];
    const bestRel = (k, denK) => M.filter(m => m[k] != null && m[denK] >= MIN_DEN).sort((a, b) => b[k] - a[k])[0];
    const bv = best('views_avg'), bo = best('open_rate');
    const br = bestRel('views_rel', 'den_reach'), bg = bestRel('reactions_rel', 'den_eng'), bs = bestRel('signups_rel', 'den_eng');
    const cmpHead = [
      tile(T.tTotalSubs, nf.format(tot('subscribers')), signedDelta(M.reduce((a, m) => a + (m.delta30 || 0), 0)), 'hero'),
      tile(T.tPostsRange(range), nf.format(tot('posts')), { text: T.totalViews(nf.format(tot('views'))) }),
    ];
    $('#cmp-tiles').innerHTML = (isRel() ? cmpHead.concat([
      tile(T.tBestReach, br ? esc(br.name) : '—', br ? { text: T.viewsPer100Of(dec(br.views_rel)) } : null),
      tile(T.tBestOpen, bo ? esc(bo.name) : '—', bo ? { text: pf(bo.open_rate) } : null),
      tile(T.tMostEngagement, bg ? esc(bg.name) : '—', bg ? { text: T.reactionsPer100Of(dec(bg.reactions_rel)) } : null),
      tile(T.tBestConversion, bs ? esc(bs.name) : '—', bs ? { text: T.signupsPer1000Of(dec(bs.signups_rel)) } : null),
    ]) : cmpHead.concat([
      tile(T.tMostViewsPerPost, bv ? esc(bv.name) : '—', bv ? { text: T.viewsAvgOf(nf.format(Math.round(bv.views_avg))) } : null),
      tile(T.tBestOpen, bo ? esc(bo.name) : '—', bo ? { text: pf(bo.open_rate) } : null),
      tile(T.tSignups, nf.format(tot('signups')), { text: T.unsubs(nf.format(tot('unsubscribes'))) }),
    ])).join('');
    $('#cmp-sub').textContent = isRel() ? T.cmpSubRel(range) : T.cmpSubAbs(range);
    $('#cmp-legend').innerHTML = M.map(m => `<span><i style="background:${pubColor(m.i)}"></i>${esc(m.name)}</span>`).join('');
    const { key, dir } = state.cmpSort;
    const rows = M.slice().sort((a, b) => { if (key === 'name') return dir === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name); const va = a[key] ?? -Infinity, vb = b[key] ?? -Infinity; return dir === 'asc' ? va - vb : vb - va; });
    const cmpCols = isRel() ? CMP_COLS_REL : CMP_COLS_ABS;
    $('#cmp-table thead').innerHTML = `<tr>${cmpCols.map(c => `<th class="${c.t ? 't' : ''}" data-key="${c.key}" ${c.title ? `title="${c.title}"` : ''} aria-sort="${key === c.key ? (dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${c.label}</th>`).join('')}</tr>`;
    $('#cmp-table thead').onclick = e => { const th = e.target.closest('th'); if (!th) return; const k = th.dataset.key; state.cmpSort = { key: k, dir: state.cmpSort.key === k && state.cmpSort.dir === 'desc' ? 'asc' : 'desc' }; renderCompare(); };
    $('#cmp-table tbody').innerHTML = rows.map(m => `<tr data-idx="${m.i}">${cmpCols.map(c => cmpCellOf(m, c.key)).join('')}</tr>`).join('');
    $('#cmp-table tbody').onclick = e => { const tr = e.target.closest('tr[data-idx]'); if (!tr) return; selectView(+tr.dataset.idx); scrollTo({ top: 0, behavior: 'smooth' }); };
    $('#cmp-views-h').textContent = isRel() ? T.viewsPer100 : T.viewsPerPost;
    $('#cmp-views-sub').textContent = isRel() ? T.cmpViewsSubRel(range) : T.cmpViewsSubAbs(range);
    hbars('#cmp-subs', M.map(m => ({ i: m.i, label: m.name, v: m.subscribers, text: nf.format(m.subscribers) })));
    hbars('#cmp-views', isRel()
      ? M.filter(m => m.views_rel != null).map(m => ({ i: m.i, label: m.name, v: m.views_rel, text: dec(m.views_rel), tip: T.viewsInPosts(nf.format(m.views), m.posts) }))
      : M.filter(m => m.views_avg != null).map(m => ({ i: m.i, label: m.name, v: Math.round(m.views_avg), text: nf.format(Math.round(m.views_avg)), tip: T.viewsInPosts(nf.format(m.views), m.posts) })));
    hbars('#cmp-open', M.filter(m => m.open_rate != null).map(m => ({ i: m.i, label: m.name, v: m.open_rate, text: pf(m.open_rate), tip: `CTR ${pf(m.ctr)}` })));
    renderTop();
  }
  function signedDelta(d) { return d ? { text: T.vsPrev30(`${d > 0 ? '+' : '−'}${nf.format(Math.abs(d))}`), cls: d > 0 ? 'up' : 'down' } : { text: T.noChange30 }; }
  // barras horizontales con color fijo por publicación
  function hbars(sel, rows) {
    const box = $(sel); box.innerHTML = '';
    rows = rows.slice().sort((a, b) => b.v - a.v);
    if (!rows.length) { box.innerHTML = `<div class="empty">${T.noDataRange}</div>`; return; }
    const W = width(sel), rowH = 28, m = { l: 120, r: 64 }, H = rows.length * rowH + 8, max = Math.max(...rows.map(r => r.v), 1e-9);
    const svg = svgEl(W, H);
    rows.forEach((r, i) => {
      const yy = 4 + i * rowH, w = (W - m.l - m.r) * r.v / max;
      svg.appendChild(el('text', { x: m.l - 8, y: yy + 16, 'text-anchor': 'end', class: 'tick' }, r.label.length > 16 ? r.label.slice(0, 15) + '…' : r.label));
      const bar = el('path', { d: `M${m.l},${yy + 4} h${Math.max(0, w - 4)} a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h${-Math.max(0, w - 4)} z`, class: 'bar' }); bar.style.fill = pubColor(r.i); svg.appendChild(bar);
      svg.appendChild(el('text', { x: m.l + w + 6, y: yy + 16, class: 'dlabel' }, r.text));
      const hit = el('rect', { x: 0, y: yy, width: W, height: rowH, class: 'hit' }); svg.appendChild(hit);
      hit.addEventListener('mousemove', e => showTip(`<b>${esc(r.label)}</b>${r.text}${r.tip ? ' · ' + r.tip : ''}`, e.clientX, e.clientY)); hit.addEventListener('mouseleave', hideTip);
      hit.addEventListener('click', () => { selectView(r.i); scrollTo({ top: 0, behavior: 'smooth' }); });
    });
    box.appendChild(svg);
  }
  function renderTop() {
    const relMap = { views: 'views_rel', reactions: 'reactions_rel', signups: 'signups_rel', open_rate: 'open_rate' };
    const base = state.topMetric, k = isRel() ? relMap[base] : base;
    const denOf = (x) => k === 'views_rel' ? x.delivered : k === 'open_rate' ? x.delivered : x.views;
    const all = DATA.publications.flatMap((p, i) => postsInRange(p).map(x => ({ ...x, ...relOf(x), i, pub: p.name })))
      .filter(x => (base !== 'open_rate' || x.delivered > 0) && x[k] != null && (!isRel() || denOf(x) >= MIN_DEN));
    const top = all.slice().sort((a, b) => (b[k] || 0) - (a[k] || 0)).slice(0, 10);
    const label = isRel()
      ? { views: T.lblViewsRel, open_rate: T.lblOpen, reactions: T.lblReactionsRel, signups: T.lblSignupsRel }[base]
      : { views: T.lblViews, open_rate: T.lblOpen, reactions: T.lblReactions, signups: T.lblSignups }[base];
    $('#cmp-top-sub').textContent = T.topBy(label, nf.format(all.length))
      + (state.days ? T.lastDays(state.days) : '') + (isRel() ? T.excludeBelow(MIN_DEN) : '.');
    const topVal = (x) => k === 'open_rate' ? pf(x.open_rate) : REL_KEYS.has(k) ? dec(x[k]) : nf.format(x[k] || 0);
    $('#cmp-top').innerHTML = top.length ? top.map((x, n) => `<li><span class="rank">${n + 1}</span><span><i class="pubdot" style="background:${pubColor(x.i)}"></i><a class="pt" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="pm">${esc(x.pub)} · ${df(x.date)}</div></span><span class="pv">${topVal(x)}<br><small>${nf.format(x.views)} ${T.uViews}${x.delivered ? ` · ${nf.format(x.delivered)} ${T.uDelivered}` : ''} · ${x.reactions} ${T.uReactions}</small></span></li>`).join('') : `<li class="empty">${T.noPostsRange}</li>`;
  }

  function renderMeta() {
    const p = pub();
    $('#meta').textContent = T.metaLineHost(p.host, new Date(p.fetched_at).toLocaleString(LOCALE));
  }

  function tile(label, value, delta, cls = '') {
    return `<div class="card tile ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${delta ? `<div class="delta ${delta.cls || ''}">${delta.text}</div>` : ''}</div>`;
  }
  function deltaOf(now, before, suffix = '') {
    if (now == null || before == null) return null;
    const d = now - before; if (!d) return { text: T.noChangePrev };
    return { text: T.vsPrev30(`${d > 0 ? '+' : '−'}${nf.format(Math.abs(d))}${suffix}`), cls: d > 0 ? 'up' : 'down' };
  }
  function renderTiles() {
    const p = pub(), s = p.summary || {}, v30 = p.summary_v2?.[30] || {};
    const posts = filtered();
    const n = posts.length;
    const avg = (k) => n ? posts.reduce((a, x) => a + (x[k] || 0), 0) / n : null;
    const sumk = (k) => posts.reduce((a, x) => a + (x[k] || 0), 0);
    const sent = posts.filter(x => x.delivered > 0);
    const openRate = sent.length ? sent.reduce((a, x) => a + x.open_rate, 0) / sent.length : null;
    const ctr = sent.length ? sent.reduce((a, x) => a + x.ctr, 0) / sent.length : null;
    const range = state.days ? T.rangeShort(state.days) : T.rangeAllShort;
    const head = [
      tile(T.subscribers, nf.format(s.totalEmail ?? v30.totalSubscribersEnd ?? 0), deltaOf(v30.totalSubscribersEnd, v30.totalSubscribersStart), 'hero'),
      tile(T.tPostsRange(range), nf.format(n), { text: T.drafts(nf.format(p.counts?.drafts ?? 0)) }),
    ];
    $('#tiles').innerHTML = (isRel() ? head.concat([
      tile(T.tViewsPer100, dec(aggRate(posts, 'views', 'delivered', REACH_DEN)), { text: T.overSends(nf.format(posts.reduce((a, x) => a + (x.delivered || 0), 0))) }),
      tile(T.tOpenAvg, pf(openRate), { text: T.ctrAvg(pf(ctr)) }),
      tile(T.tReactionsPer100, dec(aggRate(posts, 'reactions', 'views', ENG_DEN)), { text: T.commentsPer100(dec(aggRate(posts, 'comments', 'views', ENG_DEN))) }),
      tile(T.tSignupsPer1000, dec(aggRate(posts, 'signups', 'views', CONV_DEN)), { text: T.totalSignups(nf.format(sumk('signups'))) }),
    ]) : head.concat([
      tile(T.tViews30, nf.format(s.views ?? 0), s.viewsDelta != null ? { text: T.vsPrev30(`${s.viewsDelta > 0 ? '+' : '−'}${nf.format(Math.abs(s.viewsDelta))}`), cls: s.viewsDelta > 0 ? 'up' : s.viewsDelta < 0 ? 'down' : '' } : null),
      tile(T.tViewsPerPostAvg, avg('views') == null ? '—' : nf.format(Math.round(avg('views'))), { text: T.totalViews(nf.format(sumk('views'))) }),
      tile(T.tOpenAvg, pf(openRate), { text: T.ctrAvg(pf(ctr)) }),
      tile(T.tReactionsPerPost, avg('reactions') == null ? '—' : dec(avg('reactions')), { text: T.comments(nf.format(sumk('comments'))) }),
      tile(T.tSignups, nf.format(sumk('signups')), { text: T.unsubs(nf.format(sumk('unsubscribes'))) }),
    ])).join('');
  }

  // ---------- helpers for SVG ----------
  const svgEl = (w, h) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.setAttribute('width', w); s.setAttribute('height', h); s.style.width = '100%'; s.style.height = 'auto'; return s; };
  const el = (n, a = {}, txt) => { const e = document.createElementNS('http://www.w3.org/2000/svg', n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const niceTicks = (max, n = 4) => {
    if (!max || !isFinite(max) || max <= 0) return [0];
    const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    const top = Math.ceil(max / step) * step;   // redondea hacia arriba: el eje siempre cubre el dato
    const t = [];
    for (let v = 0; v <= top + 1e-9; v += step) t.push(v);
    return t;
  };
  const width = (id) => Math.max(320, $(id).clientWidth || 600);

  // ---------- subscribers line ----------
  function renderSubs() {
    const p = pub(), box = $('#subs-chart'); box.innerHTML = '';
    let ts = p.subscribers_ts.map(([d, v]) => ({ t: new Date(String(d).replace(/\//g, '-')).getTime(), v })).filter(x => !isNaN(x.t));
    if (state.days) ts = ts.filter(x => x.t >= cutoff());
    $('#subs-sub').textContent = ts.length ? T.fromTo(dfs(ts[0].t), dfs(ts[ts.length - 1].t)) : '';
    $('#subs-table').innerHTML = ts.length ? `<table><thead><tr><th class="t">${T.date}</th><th>${T.subscribers}</th></tr></thead><tbody>${ts.filter((_, i) => i % 7 === 0 || i === ts.length - 1).map(x => `<tr><td class="t">${df(x.t)}</td><td>${nf.format(x.v)}</td></tr>`).join('')}</tbody></table>` : '';
    if (ts.length < 2) { box.innerHTML = `<div class="empty">${T.noSeries}</div>`; return; }
    const W = width('#subs-chart'), H = 220, m = { t: 12, r: 16, b: 28, l: 44 };
    const svg = svgEl(W, H);
    const vmin = Math.min(...ts.map(x => x.v)), vmax = Math.max(...ts.map(x => x.v));
    const lo = Math.max(0, vmin - (vmax - vmin) * 0.3 - 1), ticks = niceTicks(vmax - lo, 4).map(t => t + lo);
    const x = (t) => m.l + (t - ts[0].t) / (ts[ts.length - 1].t - ts[0].t || 1) * (W - m.l - m.r);
    const y = (v) => H - m.b - (v - lo) / ((ticks[ticks.length - 1] || 1) - lo || 1) * (H - m.t - m.b);
    ticks.forEach(t => { svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: 'grid-line' })); svg.appendChild(el('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, compact(Math.round(t)))); });
    const nx = Math.min(6, ts.length); for (let i = 0; i < nx; i++) { const k = Math.round(i * (ts.length - 1) / (nx - 1 || 1)); svg.appendChild(el('text', { x: x(ts[k].t), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle', class: 'tick' }, dfs(ts[k].t))); }
    const path = ts.map((d, i) => `${i ? 'L' : 'M'}${x(d.t).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
    svg.appendChild(el('path', { d: `${path} L${x(ts[ts.length - 1].t)},${H - m.b} L${x(ts[0].t)},${H - m.b} Z`, class: 'area' }));
    svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis-line' }));
    svg.appendChild(el('path', { d: path, class: 'line' }));
    const last = ts[ts.length - 1];
    svg.appendChild(el('circle', { cx: x(last.t), cy: y(last.v), r: 4, class: 'dot' }));
    svg.appendChild(el('text', { x: x(last.t) - 8, y: y(last.v) - 8, 'text-anchor': 'end', class: 'dlabel' }, nf.format(last.v)));
    const cross = el('line', { y1: m.t, y2: H - m.b, class: 'crosshair', visibility: 'hidden' }); svg.appendChild(cross);
    const hdot = el('circle', { r: 4, class: 'dot', visibility: 'hidden' }); svg.appendChild(hdot);
    const hit = el('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: 'hit' }); svg.appendChild(hit);
    hit.addEventListener('mousemove', e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * W / r.width; let best = ts[0]; for (const d of ts) if (Math.abs(x(d.t) - px) < Math.abs(x(best.t) - px)) best = d; cross.setAttribute('x1', x(best.t)); cross.setAttribute('x2', x(best.t)); cross.setAttribute('visibility', 'visible'); hdot.setAttribute('cx', x(best.t)); hdot.setAttribute('cy', y(best.v)); hdot.setAttribute('visibility', 'visible'); showTip(`<b>${df(best.t)}</b>${nf.format(best.v)} ${T.uSubscribers}`, e.clientX, e.clientY); });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('visibility', 'hidden'); hdot.setAttribute('visibility', 'hidden'); hideTip(); });
    box.appendChild(svg);
  }

  // ---------- growth sources (horizontal bars) ----------
  function renderSources() {
    const p = pub(), box = $('#sources-chart'); box.innerHTML = '';
    const rows = p.growth_sources.map(r => ({ label: r.label || '?', v: +(r.subscribers || 0), traffic: +(r.traffic || 0), children: r.children || [] })).filter(r => r.v > 0).sort((a, b) => b.v - a.v);
    if (!rows.length) { box.innerHTML = `<div class="empty">${T.noSources}</div>`; return; }
    const top = rows.slice(0, 7); if (rows.length > 7) top.push({ label: 'Otros', v: rows.slice(7).reduce((a, r) => a + r.v, 0) });
    const W = width('#sources-chart'), rowH = 26, m = { l: 130, r: 44 }, H = top.length * rowH + 8, max = Math.max(...top.map(r => r.v));
    const svg = svgEl(W, H);
    top.forEach((r, i) => {
      const yy = 4 + i * rowH, w = (W - m.l - m.r) * r.v / max;
      svg.appendChild(el('text', { x: m.l - 8, y: yy + 15, 'text-anchor': 'end', class: 'tick' }, r.label.length > 18 ? r.label.slice(0, 17) + '…' : r.label));
      svg.appendChild(el('path', { d: `M${m.l},${yy + 3} h${Math.max(0, w - 4)} a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h${-Math.max(0, w - 4)} z`, class: 'bar' }));
      svg.appendChild(el('text', { x: m.l + w + 6, y: yy + 15, class: 'dlabel' }, nf.format(r.v)));
      const hit = el('rect', { x: 0, y: yy, width: W, height: rowH, class: 'hit' }); svg.appendChild(hit);
      hit.addEventListener('mousemove', e => showTip(`<b>${esc(r.label)}</b>${T.subsAndTraffic(nf.format(r.v), nf.format(r.traffic || 0))}${(r.children || []).filter(c => c.subscribers > 0).slice(0, 4).map(c => `<br>· ${esc(c.label.slice(0, 40))}: ${nf.format(c.subscribers)}`).join('')}`, e.clientX, e.clientY)); hit.addEventListener('mouseleave', hideTip);
    });
    box.appendChild(svg);
  }

  // ---------- views per post (columns, chronological) ----------
  function renderViews() {
    const box = $('#views-chart'); box.innerHTML = '';
    const posts = filtered().slice().sort((a, b) => new Date(a.date) - new Date(b.date));
    const rel = isRel();
    const mv = (p) => rel ? relOf(p).views_rel : p.views;
    const fmtv = (v) => v == null ? '—' : rel ? dec(v) : nf.format(Math.round(v));
    const avgTxt = posts.length ? (isRel() ? aggRate(posts, 'views', 'delivered', REACH_DEN) : posts.reduce((a, x) => a + x.views, 0) / posts.length) : null;
    const avgLbl = avgTxt == null ? '' : T.greyLineAvg(rel ? dec(avgTxt) : nf.format(Math.round(avgTxt)));
    $('#views-sub').textContent = posts.length ? (rel
      ? T.chrono(posts.length) + T.viewsPer100Explain + avgLbl
      : T.chrono(posts.length) + avgLbl + T.topThreeNote) : '';
    $('#views-legend').innerHTML = posts.length ? `<span><i style="background:var(--s1)"></i>${rel ? T.viewsPer100 : T.legendPostViews}</span><span><i style="background:var(--s2)"></i>${T.legendTop3}</span>` : '';
    if (!posts.length) { box.innerHTML = `<div class="empty">${T.noPostsRange}</div>`; return; }
    const top3 = new Set(posts.slice().sort((a, b) => (mv(b) ?? -1) - (mv(a) ?? -1)).slice(0, 3).map(p => p.id));
    const W = width('#views-chart'), H = 240, m = { t: 12, r: 12, b: 30, l: 44 };
    const svg = svgEl(W, H);
    const max = Math.max(...posts.map(p => mv(p) ?? 0), rel ? 0.1 : 1), ticks = niceTicks(max, 4), tmax = ticks[ticks.length - 1] || max;
    const y = (v) => H - m.b - v / tmax * (H - m.t - m.b);
    ticks.forEach(t => { svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: 'grid-line' })); svg.appendChild(el('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, rel ? dec(t, tmax < 10 ? 1 : 0) : compact(t))); });
    svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis-line' }));
    const slot = (W - m.l - m.r) / posts.length, bw = Math.min(24, Math.max(3, slot - 2));
    const avg = rel ? aggRate(posts, 'views', 'delivered', REACH_DEN) : posts.reduce((a, p) => a + p.views, 0) / posts.length;
    if (avg != null) svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: y(avg), y2: y(avg), class: 'axis-line', stroke: 'var(--muted)' }));
    posts.forEach((p, i) => {
      const v = mv(p) ?? 0;
      const cx = m.l + slot * i + slot / 2, x0 = cx - bw / 2, h = Math.max(0, (H - m.b) - y(v));
      const rr = Math.min(4, bw / 2, h);
      if (h > 0) svg.appendChild(el('path', { d: `M${x0},${H - m.b} v${-(h - rr)} a${rr},${rr} 0 0 1 ${rr},${-rr} h${bw - 2 * rr} a${rr},${rr} 0 0 1 ${rr},${rr} v${h - rr} z`, class: 'bar' + (top3.has(p.id) ? ' hi' : '') }));
      if (top3.has(p.id) && bw >= 10 && h > 0) svg.appendChild(el('text', { x: cx, y: y(v) - 5, 'text-anchor': 'middle', class: 'dlabel' }, fmtv(mv(p))));
      const hit = el('rect', { x: m.l + slot * i, y: m.t, width: slot, height: H - m.t - m.b, class: 'hit' }); svg.appendChild(hit);
      const rp = relOf(p);
      hit.addEventListener('mousemove', e => showTip(`<b>${esc(p.title)}</b>${df(p.date)}<br>${nf.format(p.views)} ${T.uViews}${p.delivered ? T.perHundredSubs(dec(rp.views_rel), nf.format(p.delivered)) : ' · ' + T.notEmailed}<br>${T.tipOpen(p.delivered ? pf(p.open_rate) : '—')} · ${T.tipReactions(p.reactions, dec(rp.reactions_rel))}`, e.clientX, e.clientY));
      hit.addEventListener('mouseleave', hideTip);
      hit.addEventListener('click', () => { openDetail(p.id, true); });
    });
    const nx = Math.min(6, posts.length); for (let i = 0; i < nx; i++) { const k = Math.round(i * (posts.length - 1) / (nx - 1 || 1)); svg.appendChild(el('text', { x: m.l + slot * k + slot / 2, y: H - 8, 'text-anchor': 'middle', class: 'tick' }, dfs(posts[k].date))); }
    box.appendChild(svg);
  }

  // ---------- table ----------
  const COLS_ABS = [
    { key: 'title', label: T.cPost, t: true },
    { key: 'views', label: T.mViews },
    { key: 'vs', label: T.cVsAvg, title: T.cVsAvgTitle },
    { key: 'open_rate', label: T.mOpen },
    { key: 'ctr', label: 'CTR' },
    { key: 'reactions', label: T.cReactions },
    { key: 'comments', label: T.cComments },
    { key: 'shares', label: T.cShares },
    { key: 'signups', label: T.mSignups },
    { key: 'delivered', label: T.cDelivered },
  ];
  const COLS_REL = [
    { key: 'title', label: T.cPost, t: true },
    { key: 'delivered', label: T.cAudience, title: T.cAudienceTitle },
    { key: 'views_rel', label: T.cViewsPer100, title: T.cViewsPer100Title },
    { key: 'vs', label: T.cVsAvg, title: T.cVsAvgTitle },
    { key: 'open_rate', label: T.mOpen },
    { key: 'ctr', label: 'CTR' },
    { key: 'reactions_rel', label: T.cReactionsPer100 },
    { key: 'comments_rel', label: T.cCommentsPer100 },
    { key: 'signups_rel', label: T.cSignupsPer1000 },
  ];
  const COLS = () => isRel() ? COLS_REL : COLS_ABS;
  const REL_KEYS = new Set(['views_rel', 'reactions_rel', 'comments_rel', 'signups_rel']);
  const cellOf = (p, key) => {
    if (key === 'title') return `<td class="t"><div class="title">${esc(p.title)}${p.audience === 'only_paid' ? `<span class="badge">${T.badgePaid}</span>` : ''}${p.type !== 'newsletter' ? `<span class="badge">${esc(p.type)}</span>` : ''}</div><div class="date">${df(p.date)}</div></td>`;
    if (key === 'vs') return `<td><span class="vs ${p.vs == null ? '' : p.vs >= 0 ? 'up' : 'down'}">${pctSigned(p.vs)}</span></td>`;
    if (key === 'open_rate' || key === 'ctr') return `<td>${p.delivered ? pf(p[key]) : '—'}</td>`;
    if (REL_KEYS.has(key)) return `<td>${dec(p[key])}</td>`;
    return `<td>${nf.format(p[key] || 0)}</td>`;
  };
  const vsOf = (p) => (p.comps && p.comps.views) ? p.views / p.comps.views - 1 : null;
  function renderTable() {
    const posts = filtered().map(p => ({ ...p, vs: vsOf(p), ...relOf(p) }));
    const { key, dir } = state.sort;
    posts.sort((a, b) => { let va = a[key], vb = b[key]; if (key === 'title') { va = (va || '').toLowerCase(); vb = (vb || '').toLowerCase(); return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); } if (key === 'date') { va = new Date(a.date); vb = new Date(b.date); } va = va ?? -Infinity; vb = vb ?? -Infinity; return dir === 'asc' ? va - vb : vb - va; });
    const cols = COLS();
    $('#posts-sub').textContent = T.postsSub(posts.length, isRel() ? T.normalisedShort : '');
    $('#posts thead').innerHTML = `<tr>${cols.map(c => `<th class="${c.t ? 't' : ''}" data-key="${c.key}" ${c.title ? `title="${c.title}"` : ''} aria-sort="${key === c.key || (c.key === 'title' && key === 'date') ? (dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${c.label}</th>`).join('')}</tr>`;
    $('#posts thead').onclick = e => { const th = e.target.closest('th'); if (!th) return; let k = th.dataset.key; if (k === 'title') k = state.sort.key === 'date' ? 'title' : 'date'; state.sort = { key: k, dir: state.sort.key === k && state.sort.dir === 'desc' ? 'asc' : 'desc' }; renderTable(); };
    $('#posts tbody').innerHTML = posts.length
      ? posts.map(p => `<tr data-id="${p.id}"${p.id === state.selected ? ' class="selected"' : ''}>${cols.map(c => cellOf(p, c.key)).join('')}</tr>`
          + (p.id === state.selected ? `<tr class="detailrow" data-detail="${p.id}"><td colspan="${cols.length}"><div class="detailbox">${detailHtml(p)}</div></td></tr>` : '')).join('')
      : `<tr><td colspan="${cols.length}" class="empty">${T.noPostsRange}</td></tr>`;
    wireDetail();
    $('#posts tbody').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (!tr) return; openDetail(state.selected === +tr.dataset.id ? null : +tr.dataset.id); };
  }

  // ---------- detail ----------
  // El detalle se despliega como una fila justo debajo del post pulsado. Antes vivía en una
  // tarjeta al final de la página: con muchos posts el clic parecía no hacer nada.
  function openDetail(id, scroll) {
    state.selected = id;
    renderTable();
    if (scroll && id != null) {
      const row = $(`#posts tbody tr[data-id="${id}"]`);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function detailHtml(p) {
    const vs = vsOf(p), r = relOf(p);
    const stat = (l, v, n) => `<div class="dstat"><div class="l">${l}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ''}</div>`;
    const tags = [p.audience === 'only_paid' ? T.audPaid : T.audEveryone, p.type !== 'newsletter' ? p.type : null].filter(Boolean).join(' · ');
    const refs = (p.referrers || []).slice(0, 6);
    const links = (p.links || []).slice(0, 6);
    const daily = p.daily || [];
    return `
      <div class="dhead">
        <div>
          <h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
          <div class="sub">${df(p.date)} · ${esc(tags)}</div>
        </div>
        <button class="btn" id="detail-close">${T.close}</button>
      </div>
      <div class="dstats">${[
        stat(T.mViews, nf.format(p.views), vs == null ? T.deliveredN(nf.format(p.delivered)) : T.vsComparables(pctSigned(vs))),
        stat(T.mOpen, p.delivered ? pf(p.open_rate) : '—', p.delivered ? T.ofN(nf.format(p.opened), nf.format(p.delivered)) : T.notEmailed),
        stat('CTR', p.delivered ? pf(p.ctr) : '—', T.uniqueClicks(nf.format(p.clicked))),
        stat(T.mReactions, nf.format(p.reactions), T.commentsShares(nf.format(p.comments), nf.format(p.shares))),
        stat(T.mSignups, nf.format(p.signups), T.signupsNote(p.signups_1d, p.unsubscribes)),
      ].join('')}</div>
      <div class="dcaption">${T.normalisedCaption}</div>
      <div class="dstats">${[
        stat(T.dViewsPer100, dec(r.views_rel), T.reachOverSend),
        stat(T.dReactionsPer100, dec(r.reactions_rel), T.engagementOverReach),
        stat(T.dSignupsPer1000, dec(r.signups_rel), T.conversionOverTraffic),
        p.comps ? stat(T.dComparable, nf.format(Math.round(p.comps.views || 0)), T.comparableNote(pf(p.comps.open_rate), p.comps.n)) : '',
      ].join('')}</div>
      <hr class="dsep">
      <div class="dcols">
        <section>
          <h4>${T.secSources}</h4>
          ${refs.length ? refs.map(s => { const pct = Math.max(0, Math.min(1, +s.percent_of_total_views || 0)); return `<div class="srcrow"><div class="t"><span>${esc(s.source)}</span><span>${nf.format(s.views)} · ${pf(pct, 0)}</span></div><div class="srcbar"><i style="width:${(pct * 100).toFixed(1)}%"></i></div></div>`; }).join('') : `<div class="dempty">${T.noOrigin}</div>`}
        </section>
        <section>
          <h4>${T.secWeek}</h4>
          ${daily.length ? '<div id="daily-chart"></div>' : `<div class="dempty">${T.noDaily}</div>`}
        </section>
        <section>
          <h4>${T.secLinks}</h4>
          ${links.length ? links.map(([u, c]) => `<div class="linkrow"><span title="${esc(u)}">${esc(String(u).replace(/^https?:\/\//, ''))}</span><span>${nf.format(c)}</span></div>`).join('') : `<div class="dempty">${T.noClicks}</div>`}
        </section>
      </div>`
  }

  function wireDetail() {
    const closeBtn = $('#detail-close');
    if (!closeBtn) return;
    closeBtn.onclick = () => openDetail(null);
    const p = pub().posts.find(x => x.id === state.selected);
    const daily = p ? (p.daily || []) : [];
    if (daily.length && $('#daily-chart')) {
      const W = width('#daily-chart'), H = 140, m = { t: 18, r: 4, b: 22, l: 4 }, max = Math.max(...daily.map(d => d.views), 1);
      const svg = svgEl(W, H), slot = (W - m.l - m.r) / daily.length, bw = Math.min(26, slot - 8), y = (v) => H - m.b - v / max * (H - m.t - m.b);
      svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis-line' }));
      daily.forEach((d, i) => {
        const x0 = m.l + slot * i + (slot - bw) / 2, h = (H - m.b) - y(d.views), rr = Math.min(4, bw / 2, h);
        if (h > 0) svg.appendChild(el('path', { d: `M${x0},${H - m.b} v${-(h - rr)} a${rr},${rr} 0 0 1 ${rr},${-rr} h${bw - 2 * rr} a${rr},${rr} 0 0 1 ${rr},${rr} v${h - rr} z`, class: 'bar' }));
        svg.appendChild(el('text', { x: x0 + bw / 2, y: H - 7, 'text-anchor': 'middle', class: 'tick' }, 'd' + i));
        svg.appendChild(el('text', { x: x0 + bw / 2, y: y(d.views) - 6, 'text-anchor': 'middle', class: 'dlabel' }, nf.format(d.views)));
      });
      $('#daily-chart').appendChild(svg);
    }
  }

  // ---------- mapa de suscriptores ----------
  // Rampa de un solo tono sobre escala logarítmica: un país suele concentrar la mayoría
  // de la lista, y en escala lineal el resto quedaría indistinguible del fondo.
  // El nombre del país lo pone el navegador en el idioma activo; Natural Earth solo trae inglés.
  const regionName = (() => {
    try { const dn = new Intl.DisplayNames([LOCALE], { type: 'region' }); return (c) => dn.of(c) || (WORLD && WORLD.names[c]) || c; }
    catch { return (c) => (WORLD && WORLD.names[c]) || c; }
  })();
  function renderGeo() {
    const p = pub(), box = $('#geo-map'), list = $('#geo-list');
    box.innerHTML = ''; list.innerHTML = '';
    const rows = (p.geo || []).filter(r => r.value > 0).sort((a, b) => b.value - a.value);
    if (!rows.length || !WORLD) { $('#geo-sub').textContent = ''; box.innerHTML = `<div class="empty">${T.noGeo}</div>`; return; }
    const total = rows.reduce((a, r) => a + r.value, 0);
    $('#geo-sub').textContent = T.geoSub(nf.format(rows.length), nf.format(p.geo_total ?? total));
    const by = Object.fromEntries(rows.map(r => [r.code, r.value]));
    const max = rows[0].value;
    const step = (v) => { if (!v) return 0; const t = Math.log(v + 1) / Math.log(max + 1); return Math.max(1, Math.min(5, Math.ceil(t * 5))); };

    const svg = svgEl(WORLD.w, WORLD.h);
    svg.setAttribute('role', 'img');
    for (const [code, d] of Object.entries(WORLD.paths)) {
      const v = by[code] || 0;
      const path = el('path', { d, class: 'cpath' + (v ? ' has' : ''), 'fill-rule': 'evenodd' });
      if (v) path.style.fill = `var(--map-${step(v)})`;
      const name = regionName(code);
      path.addEventListener('mousemove', e => showTip(`<b>${esc(name)}</b>${v ? nf.format(v) + ' ' + T.uSubscribers : '—'}`, e.clientX, e.clientY));
      path.addEventListener('mouseleave', hideTip);
      svg.appendChild(path);
    }
    box.appendChild(svg);
    const legend = document.createElement('div');
    legend.className = 'maplegend';
    legend.innerHTML = `<span>${T.legendLess}</span>` + [1, 2, 3, 4, 5].map(i => `<i style="background:var(--map-${i})"></i>`).join('') + `<span>${T.legendMore}</span>`;
    box.appendChild(legend);

    // La lista da las cifras exactas: el color solo ordena de un vistazo.
    const top = rows.slice(0, 8);
    const rest = rows.slice(8).reduce((a, r) => a + r.value, 0);
    if (rest) top.push({ code: null, value: rest });
    list.innerHTML = top.map(r => {
      const name = r.code ? regionName(r.code) : T.countryOthers;
      const pct = r.value / total;
      return `<div class="srcrow"><div class="t"><span>${esc(name)}</span><span>${nf.format(r.value)} · ${pf(pct, 0)}</span></div><div class="srcbar"><i style="width:${(pct * 100).toFixed(1)}%"></i></div></div>`;
    }).join('');
  }

  // ---------- notas ----------
  const NOTE_COLS = [
    { key: 'body', label: () => T.cNote, t: true },
    { key: 'reactions', label: () => T.mReactions },
    { key: 'restacks', label: () => T.cRestacks },
    { key: 'replies', label: () => T.cReplies },
  ];
  function renderNotes() {
    const all = (DATA.notes || []).slice();
    const notes = all.filter(n => new Date(n.date).getTime() >= cutoff());
    $('#meta').textContent = T.metaLine(DATA.publications.length, new Date(DATA.generated_at).toLocaleString(LOCALE));
    const sum = (k) => notes.reduce((a, n) => a + (n[k] || 0), 0);
    const oldest = notes.length ? df(notes[notes.length - 1].date) : null;
    $('#notes-tiles').innerHTML = [
      tile(T.tNotes, nf.format(notes.length), oldest ? { text: T.sinceDate(oldest) } : null, 'hero'),
      tile(T.tNotesReactions, nf.format(sum('reactions'))),
      tile(T.tNotesPerNote, notes.length ? dec(sum('reactions') / notes.length) : '—'),
      tile(T.tNotesRestacks, nf.format(sum('restacks'))),
      tile(T.tNotesReplies, nf.format(sum('replies'))),
    ].join('');
    const { key, dir } = state.notesSort;
    notes.sort((a, b) => {
      if (key === 'date') { const d = new Date(a.date) - new Date(b.date); return dir === 'asc' ? d : -d; }
      const va = a[key] ?? -Infinity, vb = b[key] ?? -Infinity;
      return dir === 'asc' ? va - vb : vb - va;
    });
    $('#notes-sub').textContent = T.notesSub(nf.format(notes.length));
    $('#notes-table thead').innerHTML = `<tr>${NOTE_COLS.map(c => `<th class="${c.t ? 't' : ''}" data-key="${c.key}" aria-sort="${key === c.key || (c.key === 'body' && key === 'date') ? (dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${c.label()}</th>`).join('')}</tr>`;
    $('#notes-table thead').onclick = e => {
      const th = e.target.closest('th'); if (!th) return;
      let k = th.dataset.key; if (k === 'body') k = state.notesSort.key === 'date' ? 'body' : 'date';
      if (k === 'body') return;
      state.notesSort = { key: k, dir: state.notesSort.key === k && state.notesSort.dir === 'desc' ? 'asc' : 'desc' };
      renderNotes();
    };
    $('#notes-table tbody').innerHTML = notes.length ? notes.map(n => {
      const text = String(n.body || '').replace(/\s+/g, ' ').trim();
      return `<tr>
        <td class="t"><div class="title"><a class="pt" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(text.slice(0, 140))}${text.length > 140 ? '…' : ''}</a></div><div class="date">${df(n.date)}${n.attachments ? ' · 📎' + n.attachments : ''}</div></td>
        <td>${nf.format(n.reactions)}</td><td>${nf.format(n.restacks)}</td><td>${nf.format(n.replies)}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="${NOTE_COLS.length}" class="empty">${T.noNotes}</td></tr>`;
  }


  addEventListener('resize', () => { if (state.pub === -1) renderCompare(); else if (state.pub === -2) renderNotes(); else { renderSubs(); renderSources(); renderViews(); renderGeo(); } });
  initPanels();
  selectView(primaryIdx);
})();
</script>
</body>
</html>
